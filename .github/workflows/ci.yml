name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Termox.Tests/Termox.Tests.csproj

      - name: Set up keyring (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-tools

      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            dbus-run-session -- bash -c 'echo -n "ci" | gnome-keyring-daemon --unlock --daemonize; dotnet test tests/Termox.Tests/Termox.Tests.csproj --no-restore --configuration Release'
          else
            dotnet test tests/Termox.Tests/Termox.Tests.csproj --no-restore --configuration Release
          fi

      - name: Build application
        run: dotnet build Termox.csproj --no-restore --configuration Release
