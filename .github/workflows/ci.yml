name: CI

# ---------------------------------------------------------------------------
# GitFlow branch model
#
#  main          Production branch. Every push here is a released commit.
#                CI verifies the post-merge state on all three platforms.
#
#  dev           Integration branch. All feature branches merge here first.
#                Full build-and-test matrix runs on every push.
#
#  feature/**    Short-lived feature branches. CI runs when a PR is opened
#                or updated against dev.
#
#  release/**    Release preparation branches cut from dev. CI runs on push
#                to catch regressions before merging to main.
#
#  hotfix/**     Emergency fix branches cut from main. CI runs on push so
#                the fix is verified before it merges back to main and dev.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # Restore the test project explicitly so its assets file is generated.
      - name: Restore
        run: dotnet restore tests/Termox.Tests/Termox.Tests.csproj

      - name: Set up keyring (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-tools

      - name: Test
        shell: bash
        run: |
          TEST_CMD='dotnet test tests/Termox.Tests/Termox.Tests.csproj --no-restore --configuration Release --collect:"XPlat Code Coverage" --results-directory coverage'
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            dbus-run-session -- bash -c "echo -n 'ci' | gnome-keyring-daemon --unlock --daemonize; $TEST_CMD"
          else
            eval "$TEST_CMD"
          fi

      - name: Build application
        run: dotnet build Termox.csproj --no-restore --configuration Release

      # Upload coverage once (Ubuntu only) to avoid duplicate Codecov reports.
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5.4.3
        with:
          files: coverage/**/coverage.cobertura.xml
          fail_ci_if_error: false
