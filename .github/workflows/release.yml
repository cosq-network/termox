name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: termox-release
  cancel-in-progress: false

jobs:
  version:
    name: Calculate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Increment semantic version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$GITHUB_DEFAULT_BRANCH" ]]; then
            echo "Releases must run from the default branch ($GITHUB_DEFAULT_BRANCH)." >&2
            exit 1
          fi
          latest="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1 || true)"
          current="${latest#v}"
          [[ -n "$current" ]] || current=1.0.0
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          git rev-parse "v$version" >/dev/null 2>&1 && { echo "Release tag v$version already exists." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Release verification
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore tests/Termox.Tests/Termox.Tests.csproj
      - run: dotnet test tests/Termox.Tests/Termox.Tests.csproj --no-restore --configuration Release

  windows:
    name: Windows installer
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Publish Windows application
        shell: powershell
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: dotnet publish Termox.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$env:VERSION -p:VersionPrefix=$env:VERSION -o artifacts/publish/win-x64
      - name: Build Windows installer
        shell: powershell
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: iscc /DMyAppVersion=$env:VERSION /DSourceDir="$env:GITHUB_WORKSPACE\artifacts\publish\win-x64" packaging\windows\termox.iss
      - name: Verify Windows installer
        shell: powershell
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: if (-not (Test-Path "artifacts/release/Termox-$env:VERSION-windows-x64.exe")) { throw "Windows installer was not created." }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: artifacts/release/Termox-*.exe
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - run: bash packaging/linux/build-linux.sh "${{ needs.version.outputs.version }}" linux-x64
      - name: Verify Linux packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -s "artifacts/release/Termox-$VERSION-linux-x64.tar.gz"
          test -s "artifacts/release/Termox-$VERSION-linux-x64.deb"
          tar -tzf "artifacts/release/Termox-$VERSION-linux-x64.tar.gz" | grep -E '(^|\./)usr/bin/Termox$'
          dpkg-deb --info "artifacts/release/Termox-$VERSION-linux-x64.deb" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: release-linux, path: artifacts/release/Termox-*, if-no-files-found: error }

  macos:
    name: macOS ${{ matrix.rid }}
    needs: [version, test]
    strategy:
      matrix:
        include:
          - { runner: macos-13, rid: osx-x64 }
          - { runner: macos-14, rid: osx-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - name: Require Apple signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing required macOS release secret: $name" >&2; exit 1; }
          done
      - name: Install Apple signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/termox-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/termox-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/termox-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Build macOS artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/build-macos.sh "${{ needs.version.outputs.version }}" "${{ matrix.rid }}"
      - name: Verify macOS bundle and notarization
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          APP="artifacts/Termox-$RID.app"
          test -d "$APP"
          test "$(plutil -extract CFBundleName raw "$APP/Contents/Info.plist")" = "termox"
          codesign --verify --deep --strict "$APP"
          xcrun stapler validate "$APP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/Termox-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: release-*, path: artifacts/release, merge-multiple: true }
      - name: Verify downloaded artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for artifact in "Termox-$VERSION-windows-x64.exe" "Termox-$VERSION-linux-x64.tar.gz" "Termox-$VERSION-linux-x64.deb" "Termox-$VERSION-osx-x64.dmg" "Termox-$VERSION-osx-x64.zip" "Termox-$VERSION-osx-arm64.dmg" "Termox-$VERSION-osx-arm64.zip"; do
            test -s "artifacts/release/$artifact" || { echo "Missing artifact: $artifact" >&2; exit 1; }
          done
      - name: Create and push release tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
      - name: Generate SHA256 checksums
        working-directory: artifacts/release
        run: sha256sum Termox-* > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Termox v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/release/*
          body: |
            Cross-platform Termox release v${{ needs.version.outputs.version }}.

            See `SHA256SUMS.txt` for artifact checksums.
      - name: Clean up failed release tag
        if: failure()
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release delete "v$VERSION" --cleanup-tag --yes || true
          git push origin ":refs/tags/v$VERSION" || true
